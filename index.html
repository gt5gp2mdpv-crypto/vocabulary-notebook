<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="単語帳">
  <title>単語帳PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button hidden" id="backButton" type="button" aria-label="戻る">‹</button>
      <div>
        <p class="eyebrow" id="screenLabel">Library</p>
        <h1 id="screenTitle">単語帳</h1>
      </div>
      <button class="icon-button" id="openMenuButton" type="button" aria-label="メニュー">☰</button>
    </header>

    <!-- ハンバーガーメニュー（ドロワー） -->
    <div class="menu-backdrop hidden" id="menuBackdrop"></div>
    <nav class="drawer" id="drawer" aria-label="メニュー">
      <div class="drawer-header">
        <span class="drawer-title">メニュー</span>
        <button class="icon-button" id="closeMenuButton" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="drawer-items">
        <button class="drawer-item" id="menuHome" type="button">単語帳一覧</button>
        <label class="drawer-item file-drawer">
          <input id="csvInput" type="file" accept=".csv,text/csv" multiple>
          CSVを追加
        </label>
        <button class="drawer-item" id="menuBackup" type="button">バックアップ / 設定</button>
      </div>
    </nav>

    <main>
      <section class="screen active" id="homeScreen">
        <div class="notice hidden" id="updateNotice">
          <strong>バックアップ推奨</strong>
          <span>アプリ更新や端末移行に備えて、定期的にJSONバックアップを保存してください。</span>
          <button id="dismissNotice" type="button">閉じる</button>
        </div>

        <section class="panel hidden" id="importPreviewPanel">
          <div class="section-head">
            <h2>インポート確認</h2>
            <button id="cancelImportButton" type="button" class="ghost-button">キャンセル</button>
          </div>
          <div id="importPreviewList" class="preview-list"></div>
          <button id="confirmImportButton" type="button" class="primary-button">この内容で保存</button>
        </section>

        <section class="section-block">
          <div class="section-head">
            <h2>単語帳</h2>
            <span id="deckCount" class="muted">0件</span>
          </div>
          <div id="deckList" class="deck-grid empty-state">まだ単語帳がありません。メニューの「CSVを追加」から読み込んでください。</div>
        </section>
      </section>

      <section class="screen" id="deckScreen">
        <div class="stats-row" id="deckStats"></div>
        <div class="tabbar" role="tablist">
          <button class="tab active" id="listTab" type="button">一覧</button>
          <button class="tab" id="testTab" type="button">テスト</button>
        </div>

        <section id="listPanel" class="tab-panel active">
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="単語・意味を検索">
            <select id="sortSelect" aria-label="並び替え">
              <option value="order">登録順</option>
              <option value="scoreAsc">スコア低い順</option>
              <option value="scoreDesc">スコア高い順</option>
              <option value="term">A-Z</option>
            </select>
          </div>
          <div id="cardList" class="word-grid"></div>
        </section>

        <section id="testPanel" class="tab-panel">
          <div class="toolbar">
            <select id="testModeSelect" aria-label="テスト対象">
              <option value="all">全単語</option>
              <option value="low">低スコア優先</option>
              <option value="untested">未テスト優先</option>
              <option value="review">復習（前回の苦手）</option>
            </select>
            <button id="startTestButton" class="primary-button" type="button">開始</button>
          </div>

          <div id="testIdle" class="empty-state">テスト対象を選んで開始してください。</div>

          <div id="testRunning" class="test-card hidden">
            <div class="timer-wrap">
              <div class="timer-track">
                <div class="timer-marker" title="残り10秒"></div>
                <div id="timerBar" class="timer-bar"></div>
              </div>
              <div id="timerText" class="timer-text">15.0秒</div>
            </div>
            <div class="test-meta">
              <span id="testProgress">1 / 1</span>
              <button id="finishTestButton" class="ghost-button danger" type="button">終了</button>
            </div>
            <button id="revealButton" class="term-button" type="button">
              <span id="testTerm"></span>
            </button>
            <div id="answerPanel" class="answer-panel hidden">
              <p id="testMeaning"></p>
              <div class="answer-actions">
                <button data-result="known" class="answer-button good" type="button">わかった</button>
                <button data-result="partial" class="answer-button mid" type="button">一部だけわかった</button>
                <button data-result="unknown" class="answer-button bad" type="button">わからなかった</button>
              </div>
            </div>
          </div>

          <div id="testSummary" class="summary hidden"></div>
        </section>
      </section>

      <section class="screen" id="backupScreen">
        <section class="panel">
          <h2>バックアップ</h2>
          <p>IndexedDB内の単語帳・スコア・テスト履歴を、アップデート対応のバージョン付きJSONとして保存します。</p>
          <div class="button-row">
            <button id="exportBackupButton" class="primary-button" type="button">JSONを書き出す</button>
            <label class="file-button secondary">
              JSONを復元
              <input id="restoreInput" type="file" accept="application/json,.json">
            </label>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
